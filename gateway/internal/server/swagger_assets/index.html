<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FAQears API — Swagger UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/favicon-32x32.png" sizes="32x32">
    <style>
        body { margin: 0; background: #fafafa; }
        .topbar { display: none; }
        #header {
            background: #1a1a1a;
            color: #fff;
            padding: 12px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            border-bottom: 3px solid #1abc9c;
        }
        #header strong { font-size: 18px; }
        #header span { opacity: 0.7; margin-left: 12px; font-size: 13px; }
    </style>
</head>
<body>
<div id="header">
    <strong>FAQears API Gateway</strong>
    <span>HTTP/JSON edge over auth + user + catalog gRPC services</span>
</div>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = function () {
        window.ui = SwaggerUIBundle({
            url: "/openapi.yaml",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: "StandaloneLayout",
            persistAuthorization: true,
            tryItOutEnabled: true
        });
    };
</script>
</body>
</html>
