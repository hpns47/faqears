run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gofumpt
    - gci
    - revive
    - gocyclo
    - gosec
    - errorlint
    - nilerr
    - ineffassign
    - misspell
    - unconvert
    - prealloc
    - bodyclose
    - contextcheck
    - noctx

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/faqears/faqears)
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: var-naming
      - name: exported
        disabled: true
  gosec:
    excludes:
      - G104

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
