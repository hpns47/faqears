name: faqears

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - faqears
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-postgres-defaults: &postgres-defaults
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: faqears
    POSTGRES_PASSWORD: faqears
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U faqears"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  postgres-auth:
    <<: [*postgres-defaults, *service-defaults]
    environment:
      POSTGRES_USER: faqears
      POSTGRES_PASSWORD: faqears
      POSTGRES_DB: auth
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  postgres-users:
    <<: [*postgres-defaults, *service-defaults]
    environment:
      POSTGRES_USER: faqears
      POSTGRES_PASSWORD: faqears
      POSTGRES_DB: users
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  postgres-catalog:
    <<: [*postgres-defaults, *service-defaults]
    environment:
      POSTGRES_USER: faqears
      POSTGRES_PASSWORD: faqears
      POSTGRES_DB: catalog
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    <<: *service-defaults

  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --set
      - redpanda.auto_create_topics_enabled=true
    volumes:
      - kafka-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "19092:19092"
    <<: *service-defaults

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: faqears
      MINIO_ROOT_PASSWORD: faqears-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    <<: *service-defaults

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      AUTH_GRPC_ADDR: ":50051"
      AUTH_DB_URL: "postgres://faqears:faqears@postgres-auth:5432/auth?sslmode=disable"
      AUTH_JWT_SECRET: "dev-secret-change-me"
      AUTH_JWT_ACCESS_TTL: "15m"
      AUTH_JWT_REFRESH_TTL: "720h"
      AUTH_BCRYPT_COST: "10"
      AUTH_KAFKA_BROKERS: "kafka:9092"
      AUTH_KAFKA_TOPIC: "auth.events"
      AUTH_MIGRATE_URL: "file:///app/migrations"
      AUTH_LOG_LEVEL: "info"
      AUTH_REDIS_ADDR: "redis:6379"
      AUTH_OAUTH_STATE_TTL: "10m"
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:50051"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "50061:50051"
    <<: *service-defaults

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      USER_GRPC_ADDR: ":50052"
      USER_DB_URL: "postgres://faqears:faqears@postgres-users:5432/users?sslmode=disable"
      USER_KAFKA_BROKERS: "kafka:9092"
      USER_KAFKA_AUTH_TOPIC: "auth.events"
      USER_KAFKA_TOPIC: "user.events"
      USER_KAFKA_GROUP_ID: "user-service"
      USER_MIGRATE_URL: "file:///app/migrations"
      USER_LOG_LEVEL: "info"
    depends_on:
      postgres-users:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:50052"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "50062:50052"
    <<: *service-defaults

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      CATALOG_GRPC_ADDR: ":50053"
      CATALOG_DB_URL: "postgres://faqears:faqears@postgres-catalog:5432/catalog?sslmode=disable"
      CATALOG_REDIS_ADDR: "redis:6379"
      CATALOG_KAFKA_BROKERS: "kafka:9092"
      CATALOG_KAFKA_TOPIC: "catalog.events"
      CATALOG_MIGRATE_URL: "file:///app/migrations"
      CATALOG_LOG_LEVEL: "info"
      CATALOG_CACHE_TTL: "5m"
    depends_on:
      postgres-catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:50053"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "50063:50053"
    <<: *service-defaults

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_AUTH_GRPC_ADDR: "auth-service:50051"
      GATEWAY_USER_GRPC_ADDR: "user-service:50052"
      GATEWAY_CATALOG_GRPC_ADDR: "catalog-service:50053"
      GATEWAY_REDIS_ADDR: "redis:6379"
      GATEWAY_TOKEN_CACHE_TTL: "30s"
      GATEWAY_RATE_LIMIT_ANON: "100"
      GATEWAY_RATE_LIMIT_AUTHED: "1000"
      GATEWAY_LOG_LEVEL: "info"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    <<: *service-defaults

volumes:
  postgres-auth-data:
  postgres-users-data:
  postgres-catalog-data:
  redis-data:
  kafka-data:
  minio-data:

networks:
  faqears:
    driver: bridge
